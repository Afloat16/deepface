name: MySQL index transaction validation

on:
  push:
    branches: [validation/20261116-mysql-index-transactions]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-password
          MYSQL_DATABASE: deepface
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated MySQL service
        run: echo "DEEPFACE_MYSQL_URI=mysql://root:local-test-password@127.0.0.1:${{ job.services.mysql.ports[3306] }}/deepface" >> "$GITHUB_ENV"
      - name: Install project and real MySQL dependencies
        run: python -m pip install -e '.[api]' pytest pytest-mock 'pymysql[rsa]' faiss-cpu black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check test formatting and diff
        run: |
          python -m black --check --line-length 100 tests/integration/test_mysql_index_transactions.py
          git diff --check
      - name: Run repository pinned Python 3.10 lint and type gates
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch pinned baseline
        run: git fetch --depth=1 origin 835a37376331c46a0a7fcc1a497faa3d2767bacc
      - name: Reproduce partial publication and rollback failures on real MySQL
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          name = "deepface/modules/database/mysql.py"
          saved = Path(name).read_bytes()
          try:
              Path(name).write_bytes(subprocess.check_output(["git", "show", f"835a37376331c46a0a7fcc1a497faa3d2767bacc:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/integration/test_mysql_index_transactions.py",
                  "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 3
              assert len(report.findall(".//testcase")) == 6
              assert not report.findall(".//error")
              assert not report.findall(".//skipped")
          finally:
              Path(name).write_bytes(saved)
      - name: Run regressions and existing real MySQL integration suite
        run: >-
          python -m pytest -q
          tests/integration/test_mysql_index_transactions.py
          tests/integration/test_database_clients.py -k mysql
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
          python -c "import os, pymysql; from deepface.modules.database.mysql import _parse_uri; c=pymysql.connect(**_parse_uri(os.environ['DEEPFACE_MYSQL_URI'])); print('MySQL server:', c.get_server_info()); c.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-index-transactions-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
