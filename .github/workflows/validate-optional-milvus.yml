name: Validate optional Milvus unit tests
on:
  push:
    branches: [validation/milvus-optional-sdk-20261001]
permissions:
  contents: read
jobs:
  without-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6b5d9899d33367b953b7f59abb563683d466945
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 numpy==2.3.5
      - name: Verify a clean collection skip without the optional SDK
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          assert importlib.util.find_spec("pymilvus") is None
          result = subprocess.run(
              [sys.executable, "-m", "pytest", "tests/unit/test_milvus_distance.py",
               "-q", "-rs", "--color=no"],
              capture_output=True, text=True,
          )
          print(result.stdout, end="")
          print(result.stderr, end="")
          assert result.returncode == 5, result.returncode
          assert "1 skipped" in result.stdout
          assert "could not import 'pymilvus'" in result.stdout
          assert "ERROR" not in result.stdout
          print("Missing optional SDK: one module skipped cleanly; pytest exit 5 is expected.")
          PY
  with-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPFACE_BACKEND_ENGINE: pytorch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6b5d9899d33367b953b7f59abb563683d466945
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements_base.txt pytest==8.4.2 pymilvus==2.6.9 'setuptools<81' 'opencv-python<5'
      - name: Run the unchanged Milvus distance assertions with the real SDK installed
        run: |
          python -c 'import importlib.metadata; assert importlib.metadata.version("pymilvus") == "2.6.9"'
          python -m pytest tests/unit/test_milvus_distance.py -q -rs
