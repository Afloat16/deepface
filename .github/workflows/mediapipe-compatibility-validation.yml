name: MediaPipe installation compatibility
on:
  push:
    branches: [validation/mediapipe-compatibility-20261116]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and resolve the declared MediaPipe requirement
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[api]' 'numpy<2' 'opencv-contrib-python-headless<4.12' jax==0.4.35 jaxlib==0.4.35 pytest black==24.8.0 pylint==2.15.10 mypy==1.14.1
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          req = next(line for line in Path('requirements_additional.txt').read_text().splitlines() if line.startswith('mediapipe'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', req], check=True)
          PY
          python -m pip install --no-deps --target "$RUNNER_TEMP/mediapipe-0.10.30" mediapipe==0.10.30
          python -m pip install --no-deps --target "$RUNNER_TEMP/mediapipe-1.2.3" mediapipe==1.2.3
      - name: Demonstrate original failures with real incompatible wheels
        env:
          PYTHONPATH: .
        run: |
          cp deepface/models/face_detection/external/MediaPipe.py "$RUNNER_TEMP/mediapipe-fixed.py"
          trap 'cp "$RUNNER_TEMP/mediapipe-fixed.py" deepface/models/face_detection/external/MediaPipe.py' EXIT
          git show 3478d3320b42afbc9cb59eabb89805c5e22831dd:deepface/models/face_detection/external/MediaPipe.py > deepface/models/face_detection/external/MediaPipe.py
          set +e
          python -m pytest -q tests/unit/test_mediapipe_installation.py tests/unit/test_mediapipe_color_order.py > before.log 2>&1
          BEFORE_EXIT=$?
          set -e
          cat before.log
          test "$BEFORE_EXIT" -eq 1
          python -c "from pathlib import Path; assert '2 failed, 4 passed' in Path('before.log').read_text()"
          for sdk in 0.10.30 1.2.3; do
            set +e
            PYTHONPATH="$RUNNER_TEMP/mediapipe-$sdk:." python validation/mediapipe_installation_native.py incompatible > native-before.log 2>&1
            NATIVE_EXIT=$?
            set -e
            cat native-before.log
            test "$NATIVE_EXIT" -eq 1
            python -c "from pathlib import Path; assert 'AttributeError' in Path('native-before.log').read_text()"
          done
      - name: Verify real compatible detection and incompatible installation guidance
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/unit/test_mediapipe_installation.py tests/unit/test_mediapipe_color_order.py tests/unit/test_ssd_opencv_version.py
          python validation/mediapipe_installation_native.py compatible
          for sdk in 0.10.30 1.2.3; do
            PYTHONPATH="$RUNNER_TEMP/mediapipe-$sdk:." python validation/mediapipe_installation_native.py incompatible
          done
          python -m black --check --line-length 100 deepface/models/face_detection/external/MediaPipe.py tests/unit/test_mediapipe_installation.py validation/mediapipe_installation_native.py
      - name: Match upstream static gates
        if: matrix.python-version == '3.10'
        run: |
          python -m pylint --fail-under=10 deepface/
          python -m mypy deepface/
