name: Registration filename preservation validation

on:
  push:
    branches: [validation/20261116-registration-path-case]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and regression dependencies
        run: python -m pip install -e '.[api]' pytest pytest-mock pandas black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check formatting and patch whitespace
        run: |
          python -m black --check --diff --line-length 100 tests/integration/test_registration_path_case.py
          git diff --check
      - name: Run repository lint and types
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch original source
        run: git fetch --depth=1 origin 3478d3320b42afbc9cb59eabb89805c5e22831dd
      - name: Verify original filename loss
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          name = "deepface/modules/datastore.py"
          patched = Path(name).read_bytes()
          try:
              Path(name).write_bytes(subprocess.check_output(["git", "show", f"3478d3320b42afbc9cb59eabb89805c5e22831dd:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/integration/test_registration_path_case.py", "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1
              assert len(report.findall(".//failure")) == 7
              assert len(report.findall(".//testcase")) == 15
              assert not report.findall(".//error")
              assert not report.findall(".//skipped")
          finally:
              Path(name).write_bytes(patched)
      - name: Run patched registration and existing connection regressions
        run: >-
          python -m pytest -q
          tests/integration/test_registration_path_case.py
          tests/unit/test_register_connection_cleanup.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-path-case-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
