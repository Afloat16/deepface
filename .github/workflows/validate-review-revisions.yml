name: Gallery and Pinecone cleanup review revisions
on:
  push:
    branches: [validation/gallery-pinecone-review-revisions-20261116]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[api]' 'numpy<2' 'opencv-contrib-python-headless<4.12' pytest black==24.8.0 pylint==2.15.10 mypy==1.14.1
      - name: Reproduce both cleanup failures on current master
        env:
          PYTHONPATH: .
          DEEPFACE_BACKEND_ENGINE: onnx
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          cases = [
              (['deepface/modules/filestore.py', 'deepface/modules/recognition.py'], 'tests/unit/test_gallery_store_lifetime.py', '10 failed, 2 passed'),
              (['deepface/modules/database/pinecone.py'], 'tests/unit/test_pinecone_client_lifetime.py', '13 failed, 2 passed'),
          ]
          for files, test, expected in cases:
              fixed = {path: Path(path).read_bytes() for path in files}
              try:
                  for path in files:
                      Path(path).write_bytes(subprocess.check_output(['git', 'show', 'c2a6fd9a2b845a958ec5d0e61d592ec7fedc0a49:' + path]))
                  result = subprocess.run(['python', '-m', 'pytest', '-q', test], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout, flush=True)
                  assert result.returncode == 1
                  assert expected in result.stdout
              finally:
                  for path, content in fixed.items():
                      Path(path).write_bytes(content)
          PY
      - name: Verify cleanup and neighboring behavior without test servers
        env:
          PYTHONPATH: .
          DEEPFACE_BACKEND_ENGINE: onnx
        run: |
          python -m pytest -q tests/unit/test_gallery_store_lifetime.py tests/unit/test_filestore.py tests/unit/test_ftp_connection.py tests/unit/test_ftp_path_encoding.py tests/unit/test_s3_object_paths.py tests/unit/test_cached_gallery_query.py tests/unit/test_single_read_find.py tests/unit/test_gallery_detection_policy.py tests/unit/test_pinecone_client_lifetime.py tests/unit/test_pinecone_listing_pages.py tests/unit/test_pinecone_index_names.py tests/unit/test_register_connection_cleanup.py
          python -m black --check --line-length 100 tests/unit/test_gallery_store_lifetime.py tests/unit/test_pinecone_client_lifetime.py deepface/modules/filestore.py deepface/modules/database/pinecone.py
          git diff --check
      - name: Match upstream static gates
        if: matrix.python-version == '3.10'
        run: |
          python -m pylint --fail-under=10 deepface/
          python -m mypy deepface/
