name: MongoDB counter initialization validation

on:
  push:
    branches: [validation/20261116-mongo-counter-initialization]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated MongoDB service
        run: echo "DEEPFACE_MONGO_URI=mongodb://127.0.0.1:${{ job.services.mongo.ports[27017] }}" >> "$GITHUB_ENV"
      - name: Install project and real MongoDB driver
        run: python -m pip install -e '.[api]' pytest pytest-mock pymongo black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check test formatting and diff
        run: |
          python -m black --check --line-length 100 tests/integration/test_mongo_counter_initialization.py
          git diff --check
      - name: Run repository pinned Python 3.10 lint and type gates
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch pinned baseline
        run: git fetch --depth=1 origin 835a37376331c46a0a7fcc1a497faa3d2767bacc
      - name: Reproduce concurrent first-client counter collisions
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          files = ["deepface/modules/database/mongo.py"]
          saved = {name: Path(name).read_bytes() for name in files}
          try:
              for name in files:
                  Path(name).write_bytes(subprocess.check_output(["git", "show", f"835a37376331c46a0a7fcc1a497faa3d2767bacc:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/integration/test_mongo_counter_initialization.py",
                  "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 4
              assert len(report.findall(".//testcase")) == 6
              assert not report.findall(".//error")
              assert not report.findall(".//skipped")
          finally:
              for name, contents in saved.items():
                  Path(name).write_bytes(contents)
      - name: Run actual MongoDB concurrency and neighboring search regressions
        run: >-
          python -m pytest -q
          tests/integration/test_mongo_counter_initialization.py
          tests/unit/test_datastore_normalized_metric.py
          tests/unit/test_search_graph_lifetime.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
          python -c "import os, pymongo; c=pymongo.MongoClient(os.environ['DEEPFACE_MONGO_URI']); print('MongoDB server:', c.server_info()['version']); c.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mongo-counter-initialization-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
