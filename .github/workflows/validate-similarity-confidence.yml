name: Similarity-search confidence validation

on:
  push:
    branches: [validation/20261116-similarity-confidence]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and actual numerical dependencies
        run: python -m pip install -e '.[api]' pytest pytest-mock pandas black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check test formatting and diff
        run: |
          python -m black --check --line-length 100 tests/unit/test_similarity_confidence.py
          git diff --check
      - name: Run repository pinned Python 3.10 lint and type gates
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch pinned baseline
        run: git fetch --depth=1 origin 835a37376331c46a0a7fcc1a497faa3d2767bacc
      - name: Reproduce false verified confidence with actual search pipelines
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          files = ["deepface/modules/recognition.py"]
          saved = {name: Path(name).read_bytes() for name in files}
          try:
              for name in files:
                  Path(name).write_bytes(subprocess.check_output(["git", "show", f"835a37376331c46a0a7fcc1a497faa3d2767bacc:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/unit/test_similarity_confidence.py",
                  "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 10
              assert len(report.findall(".//testcase")) == 24
              assert not report.findall(".//error")
              assert not report.findall(".//skipped")
          finally:
              for name, contents in saved.items():
                  Path(name).write_bytes(contents)
      - name: Run confidence regressions and neighboring threshold suites
        run: >-
          python -m pytest -q
          tests/unit/test_similarity_confidence.py
          tests/unit/test_default_dict_threshold.py
          tests/unit/test_zero_threshold.py
          tests/unit/test_find_color_consistency.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-confidence-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
