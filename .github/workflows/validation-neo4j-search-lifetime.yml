name: Neo4j search lifetime validation

on:
  push:
    branches: [validation/20261116-neo4j-search-lifetime]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687/tcp
        options: >-
          --health-cmd="cypher-shell -a bolt://localhost:7687 'RETURN 1'"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=30
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated Neo4j service
        run: echo "DEEPFACE_NEO4J_URI=bolt://127.0.0.1:${{ job.services.neo4j.ports[7687] }}" >> "$GITHUB_ENV"
      - name: Install project and real Neo4j driver
        run: python -m pip install -e '.[api]' pytest pytest-mock 'neo4j>=5,<6' black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check test formatting and diff
        run: |
          python -m black --check --diff --line-length 100 tests/integration/test_neo4j_search_lifetime.py
          git diff --check
      - name: Run repository pinned Python 3.10 lint and type gates
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch pinned baseline
        run: git fetch --depth=1 origin 835a37376331c46a0a7fcc1a497faa3d2767bacc
      - name: Reproduce retained owned drivers with actual Neo4j and GDS
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          name = "deepface/modules/datastore.py"
          saved = Path(name).read_bytes()
          try:
              Path(name).write_bytes(subprocess.check_output(["git", "show", f"835a37376331c46a0a7fcc1a497faa3d2767bacc:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/integration/test_neo4j_search_lifetime.py", "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 4
              assert len(report.findall(".//testcase")) == 8
              assert not report.findall(".//error")
              assert not report.findall(".//skipped")
          finally:
              Path(name).write_bytes(saved)
      - name: Run regressions and neighboring graph and distance suites
        run: >-
          python -m pytest -q
          tests/integration/test_neo4j_search_lifetime.py
          tests/unit/test_search_graph_lifetime.py
          tests/unit/test_neo4j_connection_uri.py
          tests/unit/test_datastore_normalized_metric.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
          python -c "import os, neo4j; d=neo4j.GraphDatabase.driver(os.environ['DEEPFACE_NEO4J_URI']); print('Neo4j server:', d.get_server_info().agent); s=d.session(); print('GDS:', s.run('RETURN gds.version() AS version').single()['version']); s.close(); d.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo4j-search-lifetime-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
