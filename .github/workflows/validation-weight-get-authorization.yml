name: Weight download method validation

on:
  push:
    branches: [validation/20261116-weight-get-authorization]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      DEEPFACE_BACKEND_ENGINE: onnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install normal project and test dependencies
        run: python -m pip install -e '.[api]' pytest pytest-mock black 'pylint==2.15.10' 'mypy==1.14.1'
      - name: Check changed tests and pinned lint gates
        run: |
          python -m black --check --line-length 100 tests/unit/test_weight_get_authorization.py
          git diff --check
      - name: Run repository pinned Python 3.10 lint and type gates
        if: matrix.python == '3.10'
        run: |
          python -m pylint deepface/ --fail-under=10
          python -m mypy deepface/
      - name: Fetch pinned baseline
        run: git fetch --depth=1 origin 835a37376331c46a0a7fcc1a497faa3d2767bacc
      - name: Reproduce original failures with the same real HTTP tests
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          name = "deepface/commons/weight_utils.py"
          saved = Path(name).read_bytes()
          try:
              Path(name).write_bytes(subprocess.check_output(["git", "show", f"835a37376331c46a0a7fcc1a497faa3d2767bacc:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "tests/unit/test_weight_get_authorization.py", "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) >= 5
              assert len(report.findall(".//testcase")) == 12
              assert not report.findall(".//error")
          finally:
              Path(name).write_bytes(saved)
      - name: Run regressions and neighboring download suites
        run: >-
          python -m pytest -q
          tests/unit/test_weight_get_authorization.py
          tests/unit/test_weight_download_soft_failure.py
          tests/unit/test_commons.py
          -k 'not test_loading_broken_weights'
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weight-get-authorization-${{ matrix.python }}
          path: |
            baseline.xml
            results.xml
