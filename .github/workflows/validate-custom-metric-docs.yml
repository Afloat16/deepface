name: Validate custom metric documentation
on:
  push:
    branches: [validation/custom-metric-docs-20261001]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            numpy: '1.24.4'
          - python: '3.12'
            numpy: '2.3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4335d238c2bdc054eb4222e7b1978b7ed2de6b78
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==${{ matrix.numpy }}
      - name: Check runtime AST and execute public docstring callback
        run: |
          python - <<'PY'
          import ast
          import copy
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import textwrap
          from pathlib import Path
          import __future__
          
          import numpy as np
          
          root = Path.cwd()
          paths = [
              "README.md",
              "deepface/DeepFace.py",
              "deepface/modules/recognition.py",
              "deepface/modules/verification.py",
          ]
          base_json = root / ".validation/base-files.json"
          if base_json.exists():
              base = json.loads(base_json.read_text())
          else:
              base = {
                  name: subprocess.check_output(
                      ["git", "show", "bf5ed7339a0d430cbd214e4923ee6a694f808dec:" + name],
                      text=True,
                  )
                  for name in paths
              }
          
          
          class WithoutDocstrings(ast.NodeTransformer):
              def remove_docstring(self, node):
                  self.generic_visit(node)
                  if (
                      node.body
                      and isinstance(node.body[0], ast.Expr)
                      and isinstance(node.body[0].value, ast.Constant)
                      and isinstance(node.body[0].value.value, str)
                  ):
                      node.body = node.body[1:]
                  return node
          
              visit_Module = remove_docstring
              visit_ClassDef = remove_docstring
              visit_FunctionDef = remove_docstring
              visit_AsyncFunctionDef = remove_docstring
          
          
          for name in paths[1:]:
              original = WithoutDocstrings().visit(ast.parse(base[name]))
              changed = WithoutDocstrings().visit(ast.parse((root / name).read_text()))
              assert ast.dump(original) == ast.dump(changed), name + ": runtime AST changed"
              print("Runtime AST unchanged:", name)
          
          assert (root / "README.md").read_text() == base["README.md"]
          print("README unchanged from upstream base.")
          api_ast = ast.parse((root / paths[1]).read_text())
          find = next(node for node in api_ast.body if isinstance(node, ast.FunctionDef) and node.name == "find")
          docstring = ast.get_docstring(find)
          examples = [
              block for block in re.findall(r"```python[^\n]*\n(.*?)```", docstring, re.S)
              if "def custom_euclidean(" in block
          ]
          assert len(examples) == 1
          example_ast = ast.parse(textwrap.dedent(examples[0]))
          custom = next(
              node for node in example_ast.body
              if isinstance(node, ast.FunctionDef) and node.name == "custom_euclidean"
          )
          verification_ast = ast.parse((root / paths[3]).read_text())
          helper = next(
              node for node in verification_ast.body
              if isinstance(node, ast.FunctionDef) and node.name == "find_distance"
          )
          ns = {"np": np}
          exec(
              compile(
                  ast.Module(body=[copy.deepcopy(custom), copy.deepcopy(helper)], type_ignores=[]),
                  "unchanged helper and docstring callback",
                  "exec",
                  flags=__future__.annotations.compiler_flag,
              ),
              ns,
          )
          calls = []
          returned = []
          
          
          def observed_callback(alpha, beta):
              assert isinstance(alpha, np.ndarray) and isinstance(beta, np.ndarray)
              calls.append((alpha.shape, beta.shape))
              result = ns["custom_euclidean"](alpha, beta)
              returned.append(result)
              return result
          
          
          scalar = ns["find_distance"]([3.0, 4.0], [0.0, 8.0], observed_callback)
          assert scalar == 5.0
          assert calls == [((2,), (2,))]
          calls.clear()
          gallery = [[0.0, 0.0], [3.0, 4.0], [6.0, 8.0]]
          queries = [[0.0, 0.0], [0.0, 8.0]]
          matrix = ns["find_distance"](gallery, queries, observed_callback)
          assert matrix.shape == (2, 3)
          np.testing.assert_array_equal(matrix, [[0.0, 5.0, 10.0], [8.0, 5.0, 6.0]])
          assert calls == [((3, 2), (2, 2))]
          assert matrix is returned[-1]
          
          api_ast = ast.parse((root / paths[1]).read_text())
          find = next(node for node in api_ast.body if isinstance(node, ast.FunctionDef) and node.name == "find")
          example_call = next(
              node.value for node in example_ast.body
              if isinstance(node, ast.Assign) and isinstance(node.value, ast.Call)
          )
          assert {keyword.arg for keyword in example_call.keywords} <= {arg.arg for arg in find.args.args}
          keyword_values = {keyword.arg: keyword.value for keyword in example_call.keywords}
          assert isinstance(keyword_values["threshold"], ast.Constant)
          assert keyword_values["batched"].value is True
          print("Docstring callback: scalar 5.0; nonsquare matrix (2, 3) with query rows and gallery columns.")
          print("Unchanged find_distance helper: NumPy conversion, one matrix callback call, result identity preserved.")
          print("Docstring find call: supported arguments and explicit threshold confirmed; image inference not run.")
          print("Python:", sys.version.split()[0], "NumPy:", np.__version__)
          PY
      - name: Verify source files stayed unchanged
        run: git diff --exit-code
