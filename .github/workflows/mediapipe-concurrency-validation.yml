name: Shared native detector concurrency
on:
  push:
    branches: [validation/mediapipe-concurrency-20261116]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native MediaPipe and OpenCV plus project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[api]' mediapipe==0.10.21 'numpy<2' 'opencv-contrib-python-headless<4.12' jax==0.4.35 jaxlib==0.4.35 pytest black==24.8.0 pylint==2.15.10 mypy==1.14.1
      - name: Demonstrate original native detector races
        env:
          PYTHONPATH: .
        run: |
          cp deepface/models/face_detection/external/MediaPipe.py "$RUNNER_TEMP/mediapipe-fixed.py"
          cp deepface/models/face_detection/opencv/OpenCv.py "$RUNNER_TEMP/opencv-fixed.py"
          trap 'cp "$RUNNER_TEMP/mediapipe-fixed.py" deepface/models/face_detection/external/MediaPipe.py; cp "$RUNNER_TEMP/opencv-fixed.py" deepface/models/face_detection/opencv/OpenCv.py' EXIT
          git show 3478d3320b42afbc9cb59eabb89805c5e22831dd:deepface/models/face_detection/external/MediaPipe.py > deepface/models/face_detection/external/MediaPipe.py
          git show 3478d3320b42afbc9cb59eabb89805c5e22831dd:deepface/models/face_detection/opencv/OpenCv.py > deepface/models/face_detection/opencv/OpenCv.py
          set +e
          python -m pytest -q tests/unit/test_mediapipe_concurrent_inference.py tests/unit/test_mediapipe_color_order.py tests/unit/test_opencv_concurrent_inference.py validation/test_mediapipe_native.py > before.log 2>&1
          BEFORE_EXIT=$?
          set -e
          cat before.log
          test "$BEFORE_EXIT" -eq 1
          python -c "from pathlib import Path; assert '5 failed, 8 passed' in Path('before.log').read_text()"
          python validation/opencv_native_concurrency.py --baseline
      - name: Verify native results and existing detector controls
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/unit/test_mediapipe_concurrent_inference.py tests/unit/test_mediapipe_color_order.py tests/unit/test_opencv_concurrent_inference.py tests/unit/test_face_crop_bounds.py validation/test_mediapipe_native.py tests/unit/test_ssd_concurrent_inference.py tests/unit/test_ssd_opencv_version.py
          python validation/opencv_native_concurrency.py
          python -m black --check --line-length 100 deepface/models/face_detection/external/MediaPipe.py deepface/models/face_detection/opencv/OpenCv.py tests/unit/test_mediapipe_concurrent_inference.py tests/unit/test_opencv_concurrent_inference.py validation/test_mediapipe_native.py validation/opencv_native_concurrency.py
      - name: Match upstream static gates
        if: matrix.python-version == '3.10'
        run: |
          python -m pylint --fail-under=10 deepface/
          python -m mypy deepface/
